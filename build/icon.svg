  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#tile)"/>
  <rect x="50" y="50" width="924" height="924" rx="206" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
